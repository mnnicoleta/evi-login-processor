plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'idea'
}

group = 'com.evi.login.processor'
version = '0.0.1-SNAPSHOT'
description = 'Evi login processor'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// ------------------ SOURCE SETS ------------------
sourceSets {
    integrationTest {
        java.srcDir file("src/integrationTest/java")
        resources.srcDir file("src/integrationTest/resources")
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.test.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    }
}

// ------------------ DEPENDENCIES ------------------
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring WebFlux & Reactive
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Kafka
    implementation 'io.projectreactor.kafka:reactor-kafka'
    implementation 'org.springframework.kafka:spring-kafka'

    // JPA + DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // R2DBC
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.postgresql:r2dbc-postgresql'

    // JSON
    implementation 'org.springframework.boot:spring-boot-starter-json'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Unit Test
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.17.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Integration Test
    integrationTestImplementation 'org.testcontainers:junit-jupiter'
    integrationTestImplementation 'org.wiremock.integrations:wiremock-spring-boot:4.2.1'
    integrationTestImplementation sourceSets.test.output
}

// ------------------ SPRING BOOT ------------------
springBoot {
    mainClass = 'com.evi.login.processor.EviLoginTrackerApplication'
    buildInfo()
}

tasks.named('bootJar') {
    archiveFileName = "${project.name}-${project.version}.jar"
}

// ------------------ TEST CONFIG ------------------
tasks.withType(Test) {
    useJUnitPlatform()
}

// ------------------ INTEGRATION TEST TASK ------------------
tasks.register('integrationTest', Test) {
    description = "Runs integration tests (only for JaCoCo, not part of build)"
    group = "verification"

    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()

    // Enable JaCoCo
    jacoco {
        destinationFile = file("$buildDir/jacoco/integrationTest.exec")
    }
}

// ------------------ JACOCO CONFIG ------------------
jacoco {
    toolVersion = "0.8.14"
}

// Unit test coverage report
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// ------------------ COMBINED COVERAGE FOR VERIFICATION ------------------
// Create a merged report including integration tests
tasks.register('jacocoMergedReport', JacocoReport) {
    group = "verification"
    description = "Merged JaCoCo report (unit + integration)"

    dependsOn test, 'integrationTest'

    classDirectories.setFrom files(sourceSets.main.output)
    sourceDirectories.setFrom files(sourceSets.main.allSource.srcDirs)
    executionData.setFrom files(
            "$buildDir/jacoco/test.exec",
            "$buildDir/jacoco/integrationTest.exec"
    )

    reports {
        xml.required = true
        html.required = true
    }
}

// Coverage verification including integration tests
tasks.register('jacocoFullCoverageVerification', JacocoCoverageVerification) {
    group = "verification"
    description = "Verify coverage including unit + integration tests"

    dependsOn test, 'integrationTest'

    classDirectories.setFrom files(sourceSets.main.output)
    executionData.setFrom files(
            "$buildDir/jacoco/test.exec",
            "$buildDir/jacoco/integrationTest.exec"
    )

    violationRules {
        rule {
            limit {
                minimum = 0.90
            }
        }
    }
}

// ------------------ IDEA CONFIG ------------------
idea {
    module {
        sourceSets.integrationTest.allSource.srcDirs.each { srcDir ->
            module.testSourceDirs += srcDir
        }
    }
}